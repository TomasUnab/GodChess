<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GodChess · Entrenamiento local</title>
    <!-- Remove the legacy COI worker: it used to intercept Supabase requests. -->
    <script>
      if (navigator.serviceWorker && !sessionStorage.getItem('godchess.sw-cleaned')) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          if (!registrations.length) return;
          return Promise.all(registrations.map(registration => registration.unregister())).then(() => {
            sessionStorage.setItem('godchess.sw-cleaned', '1');
            return caches?.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
          }).then(() => location.reload());
        }).catch(() => undefined);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
